# Builds the .deb and publishes a GitHub Release whenever a version tag is pushed:
#
#   1. bump VERSION in CMakeLists.txt's project(...) line and commit
#   2. git tag v0.2.0 && git push origin main v0.2.0
#
# Only tags trigger it (no CI on every push, by choice).
name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write # create the release and upload the .deb

jobs:
  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      # Tracktion declares JUCE with an SSH URL; fetch submodules over HTTPS instead.
      - name: Submodules
        run: |
          git config --global url."https://github.com/".insteadOf "git@github.com:"
          git submodule update --init --recursive --depth 1

      - name: Check the tag matches the version in CMakeLists.txt
        run: |
          v="v$(sed -nE 's/^project\(VelodyNative VERSION ([0-9.]+)\)/\1/p' CMakeLists.txt)"
          if [ "$v" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match CMakeLists.txt version $v"; exit 1
          fi

      - name: Build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential cmake ninja-build libasound2-dev libjack-jackd2-dev \
            libfreetype-dev libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev libxext-dev \
            libxinerama-dev libxrandr-dev libxrender-dev libxi-dev ladspa-sdk ffmpeg xvfb

      - name: Build
        run: cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release && cmake --build build

      # Same suite as locally; the GUI tests need a display. (The real Demucs test is opt-in and skipped.)
      - name: Tests
        run: xvfb-run -a ctest --test-dir build --output-on-failure

      - name: Package
        run: cd build && cpack -G DEB

      - name: Publish GitHub Release
        run: gh release create "$GITHUB_REF_NAME" build/velody-native_*.deb --title "$GITHUB_REF_NAME" --generate-notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
